
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP Nutrition | Premium Sports Supplements — Roha, Maharashtra</title>
<meta name="description" content="RP Nutrition — 100% Genuine Premium Sports Nutrition. Visit our store in Roha, Raigad, Maharashtra. Wholesale & Retail. Online delivery coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-alt:#F8F5F2;
    --card:#FFFFFF;
    --card-border:#E6E0D9;
    --red:#D62839;
    --red-deep:#8F1D2C;
    --orange:#F77F00;
    --gold:#B4650E;
    --text:#1A1512;
    --text-dim:#5C544E;
    --text-faint:#948C84;
    --success:#2F8B3D;
    --radius:10px;
    --maxw:1220px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
  ::selection{background:var(--red);color:#fff;}

  /* ---------- focus visibility ---------- */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--orange);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- scroll reveal ---------- */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease, transform .7s ease;}
  .reveal.in-view{opacity:1;transform:translateY(0);}
  .reveal-stagger > *{opacity:0;transform:translateY(20px);transition:opacity .6s ease, transform .6s ease;}
  .reveal-stagger.in-view > *{opacity:1;transform:translateY(0);}
  .reveal-stagger.in-view > *:nth-child(1){transition-delay:.05s;}
  .reveal-stagger.in-view > *:nth-child(2){transition-delay:.12s;}
  .reveal-stagger.in-view > *:nth-child(3){transition-delay:.19s;}
  .reveal-stagger.in-view > *:nth-child(4){transition-delay:.26s;}
  .reveal-stagger.in-view > *:nth-child(5){transition-delay:.33s;}
  .reveal-stagger.in-view > *:nth-child(6){transition-delay:.4s;}
  @media (prefers-reduced-motion: reduce){
    .reveal, .reveal-stagger > *{opacity:1 !important;transform:none !important;transition:none !important;}
  }

  /* ---------- premium hero polish ---------- */
  .hero-visual .seal{animation:sealFloat 6s ease-in-out infinite;}
  @keyframes sealFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .seal-ring{animation:ringSpin 14s linear infinite;}
  @keyframes ringSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .float-tag{animation:tagPulse 3.6s ease-in-out infinite;}
  .float-tag.tag2{animation-delay:1.2s;}
  @keyframes tagPulse{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @media (prefers-reduced-motion: reduce){
    .hero-visual .seal, .seal-ring, .float-tag{animation:none !important;}
  }

  /* ---------- hero entrance animation ---------- */
  .hero-in{opacity:0;transform:translateY(24px);animation:heroIn .8s ease forwards;}
  .hero-in-1{animation-delay:.1s;}
  .hero-in-2{animation-delay:.22s;}
  .hero-in-3{animation-delay:.36s;}
  .hero-in-4{animation-delay:.5s;}
  .hero-in-5{animation-delay:.62s;}
  @keyframes heroIn{to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .hero-in{opacity:1;transform:none;animation:none;}
  }

  /* ---------- animated hero background ---------- */
  .hero{background-size:200% 200%;animation:heroBgShift 12s ease-in-out infinite;}
  @keyframes heroBgShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  @media (prefers-reduced-motion: reduce){ .hero{animation:none;} }

  /* ---------- scroll cue ---------- */
  .scroll-cue{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    color:var(--text-faint);opacity:0;animation:cueFadeIn 1s ease .9s forwards, cueBounce 2s ease-in-out 1.9s infinite;
    z-index:2;
  }
  .scroll-cue:hover{color:var(--orange);}
  @keyframes cueFadeIn{to{opacity:1;}}
  @keyframes cueBounce{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,7px);}}
  @media (prefers-reduced-motion: reduce){ .scroll-cue{animation:cueFadeIn .3s ease forwards;} }

  /* ---------- search bar ---------- */
  .search-bar{max-height:0;overflow:hidden;transition:max-height .3s ease;border-bottom:0 solid var(--card-border);}
  .search-bar.open{max-height:80px;border-bottom:1px solid var(--card-border);}
  .search-bar-inner{display:flex;align-items:center;gap:12px;padding:14px 28px;color:var(--text-faint);}
  .search-bar-inner input{
    flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--text);padding:6px 0;
  }
  .search-bar-inner input::placeholder{color:var(--text-faint);}
  .search-bar-inner button{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;}
  .search-bar-inner button:hover{color:var(--red);}

  /* ---------- wishlist heart on cards ---------- */
  .wish-btn{
    position:absolute;top:12px;right:12px;z-index:2;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;transition:all .2s;
  }
  .wish-btn:hover{border-color:var(--red);color:var(--red);}
  .wish-btn.active{color:var(--red);border-color:var(--red);background:rgba(214,40,57,0.08);}
  .wish-btn.active svg{fill:var(--red);}

  /* ---------- premium card interactions ---------- */
  .card{position:relative;overflow:hidden;}
  .card::before{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
    background:linear-gradient(120deg,transparent 30%,rgba(247,127,0,0.08) 45%,rgba(214,40,57,0.1) 55%,transparent 70%);
    background-size:200% 200%;background-position:120% 0;
    transition:opacity .3s;
  }
  .card:hover::before{opacity:1;animation:cardShine 1.1s ease forwards;}
  @keyframes cardShine{from{background-position:120% 0;}to{background-position:-20% 0;}}
  .card-media .jar{transition:transform .4s ease;}
  .card:hover .card-media .jar{transform:scale(1.06) translateY(-2px);}

  /* ---------- top strip ---------- */
  .topstrip{
    background:var(--red-deep);
    color:#F6E9E9;
    font-size:12.5px;
    letter-spacing:0.04em;
    text-align:center;
    padding:7px 12px;
    font-weight:600;
  }
  .topstrip span{color:#FFD9A0;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--card-border);
  }
  .nav{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
    padding:14px 28px;max-width:var(--maxw);margin:0 auto;
  }
  .nav-links-left, .nav-links-right{display:flex;align-items:center;gap:28px;}
  .nav-links-right{justify-content:flex-end;}
  .brand{display:flex;align-items:center;gap:10px;justify-self:center;}
  .brand img{width:44px;height:44px;border-radius:50%;}
  .brand-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.03em;line-height:1;}
  .brand-name small{display:block;font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.18em;color:var(--text-faint);font-weight:600;margin-top:2px;}
  .navlinks a{font-size:14px;font-weight:600;color:var(--text-dim);transition:color .2s;white-space:nowrap;}
  .navlinks a:hover{color:var(--orange);}
  .nav-actions{display:flex;align-items:center;gap:16px;}
  .icon-btn{
    position:relative;background:none;border:1px solid var(--card-border);color:var(--text);
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:border-color .2s, background .2s;
  }
  .icon-btn:hover{border-color:var(--orange);background:rgba(247,127,0,0.08);}
  .cart-count{
    position:absolute;top:-6px;right:-6px;background:var(--orange);color:#141010;
    font-size:10.5px;font-weight:800;width:19px;height:19px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-menu{display:none;background:none;border:none;color:var(--text);cursor:pointer;}
  .mobile-nav{
    display:none;flex-direction:column;gap:2px;
    background:var(--bg-alt);border-top:1px solid var(--card-border);
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .mobile-nav.open{max-height:260px;}
  .mobile-nav a{padding:14px 28px;font-size:15px;font-weight:600;color:var(--text-dim);border-bottom:1px solid var(--card-border);}
  .mobile-nav a:hover{color:var(--orange);}
  @media (max-width:680px){
    .mobile-nav{display:flex;}
  }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 26px;border-radius:6px;font-weight:700;font-size:14.5px;
    cursor:pointer;border:none;transition:transform .15s ease, box-shadow .15s ease, background .2s;
    white-space:nowrap;
  }
  .btn-primary{background:linear-gradient(100deg,var(--red),var(--orange));color:#fff;box-shadow:0 8px 22px -8px rgba(214,40,57,0.6);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px rgba(247,127,0,0.55);}
  .btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--card-border);}
  .btn-outline:hover{border-color:var(--gold);color:var(--gold);}
  .btn-dark{background:var(--text);color:#fff;border:1.5px solid var(--text);}
  .btn-dark:hover{border-color:var(--orange);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 16px;font-size:13px;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding:96px 0 84px;
    overflow:hidden;
    background:
      radial-gradient(circle at 82% 18%, rgba(214,40,57,0.28), transparent 46%),
      radial-gradient(circle at 12% 88%, rgba(247,127,0,0.16), transparent 50%),
      var(--bg);
  }
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 70% 30%, black, transparent 65%);
  }
  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:50px;align-items:center;position:relative;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--gold);background:rgba(227,176,75,0.1);border:1px solid rgba(227,176,75,0.3);
    padding:7px 14px;border-radius:100px;margin-bottom:22px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(63,163,77,0.25);}
  .hero h1{
    font-size:clamp(48px,6.4vw,86px);
    line-height:0.94;
    text-transform:uppercase;
  }
  .hero h1 .accent{
    background:linear-gradient(100deg,var(--red),var(--orange) 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.lead{
    margin-top:22px;font-size:17.5px;color:var(--text-dim);max-width:480px;
  }
  .hero-ctas{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
  .hero-badges{display:flex;gap:26px;margin-top:44px;flex-wrap:wrap;}
  .hero-badge{display:flex;align-items:center;gap:10px;}
  .hero-badge .num{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);line-height:1;}
  .hero-badge .lbl{font-size:11.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}

  .hero-visual{position:relative;display:flex;align-items:center;justify-content:center;}
  .seal{
    position:relative;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #FDF8F3, #F1E9DF 72%);
    border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 30px 70px -20px rgba(214,40,57,0.28), inset 0 0 40px rgba(0,0,0,0.06);
  }
  .seal-ring{
    position:absolute;inset:14px;border-radius:50%;
    background:conic-gradient(from 200deg, var(--gold), var(--orange), var(--red), var(--gold));
    padding:3px;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
  }
  .seal img{width:66%;border-radius:50%;}
  .float-tag{
    position:absolute;background:var(--card);border:1px solid var(--card-border);
    padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:700;
    box-shadow:0 12px 30px -12px rgba(0,0,0,0.15);display:flex;align-items:center;gap:8px;
  }
  .float-tag.tag1{top:6%;left:-6%;color:var(--success);}
  .float-tag.tag2{bottom:10%;right:-8%;color:var(--gold);}

  /* ---------- trust strip ---------- */
  .trust{
    background:var(--bg-alt);border-top:1px solid var(--card-border);border-bottom:1px solid var(--card-border);
    padding:26px 0;
  }
  .trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
  .trust-item{display:flex;align-items:center;gap:12px;}
  .trust-item .ico{
    width:42px;height:42px;border-radius:8px;flex:none;
    background:rgba(214,40,57,0.12);border:1px solid rgba(214,40,57,0.3);
    display:flex;align-items:center;justify-content:center;color:var(--red);
  }
  .trust-item h4{font-size:13.5px;font-weight:700;}
  .trust-item p{font-size:12px;color:var(--text-faint);margin-top:1px;}

  /* ---------- section heading ---------- */
  .section{padding:88px 0;}
  .section-alt{background:var(--bg-alt);}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:42px;gap:20px;flex-wrap:wrap;}
  .sec-tag{font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--red);margin-bottom:10px;}
  .sec-head h2{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,4vw,48px);text-transform:uppercase;line-height:1;}
  .sec-head p{color:var(--text-dim);max-width:420px;font-size:15px;}

  /* ---------- category filter ---------- */
  .cat-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px;}
  .cat-chip{
    padding:9px 18px;border-radius:100px;border:1px solid var(--card-border);
    background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;
    transition:all .2s;
  }
  .cat-chip:hover{border-color:var(--orange);color:var(--text);}
  .cat-chip.active{background:var(--red);border-color:var(--red);color:#fff;}

  /* ---------- product grid ---------- */
  .prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
    overflow:hidden;transition:border-color .2s, transform .2s;position:relative;
  }
  .card:hover{border-color:rgba(247,127,0,0.4);transform:translateY(-4px);}
  .card-media{
    position:relative;aspect-ratio:1/0.95;
    background:linear-gradient(150deg,#FBF8F5,#F2EBE2);
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--card-border);
  }
  .card-media .jar{width:56%;color:var(--text-faint);}
  .card-cat{
    position:absolute;top:12px;left:12px;background:rgba(26,21,18,0.85);backdrop-filter:blur(4px);
    color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
    padding:5px 10px;border-radius:100px;border:1px solid rgba(227,176,75,0.3);
  }
  .stamp{
    position:absolute;bottom:10px;right:10px;width:46px;height:46px;border-radius:50%;
    background:rgba(63,163,77,0.14);border:1.5px dashed rgba(63,163,77,0.55);
    display:flex;align-items:center;justify-content:center;color:var(--success);
    transform:rotate(-12deg);
  }
  .card-body{padding:16px 16px 18px;}
  .card-body h3{font-size:15px;font-weight:700;margin-bottom:3px;}
  .card-body .desc{font-size:12.5px;color:var(--text-faint);margin-bottom:12px;min-height:32px;}
  .price-row{display:flex;align-items:center;justify-content:space-between;}
  .price{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;color:var(--gold);}
  .price .strike{font-size:12px;color:var(--text-faint);text-decoration:line-through;font-weight:500;margin-right:6px;}
  .add-btn{
    background:var(--red);color:#fff;border:none;width:38px;height:38px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s, transform .15s;
  }
  .add-btn:hover{background:var(--orange);transform:scale(1.06);}
  .add-btn.added{background:var(--success);}

  /* ---------- why us ---------- */
  .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .why-card{
    background:var(--bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:30px 26px;
    transition:border-color .2s;
  }
  .why-card:hover{border-color:rgba(214,40,57,0.4);}
  .why-num{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--red);letter-spacing:0.05em;margin-bottom:14px;}
  .why-card h3{font-size:19px;margin-bottom:9px;}
  .why-card p{color:var(--text-dim);font-size:14px;}

  /* ---------- stats ---------- */
  .stats-bar{
    display:grid;grid-template-columns:repeat(4,1fr);
    border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;
  }
  .stat{padding:30px 20px;text-align:center;border-right:1px solid var(--card-border);}
  .stat:last-child{border-right:none;}
  .stat .n{font-family:'Bebas Neue',sans-serif;font-size:42px;background:linear-gradient(100deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .l{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;font-weight:600;}

  /* ---------- wholesale banner ---------- */
  .wholesale{
    border-radius:16px;padding:56px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#FFF4F0,#FFEAE3 55%, #FFF6EC);
    border:1px solid var(--card-border);
    display:grid;grid-template-columns:1.3fr auto;gap:30px;align-items:center;
  }
  .wholesale::before{
    content:"";position:absolute;top:-40%;right:-8%;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(247,127,0,0.25),transparent 68%);
  }
  .wholesale h2{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,3.4vw,42px);text-transform:uppercase;line-height:1.05;position:relative;}
  .wholesale p{color:var(--text-dim);max-width:520px;margin-top:12px;font-size:15px;position:relative;}
  .wholesale .actions{position:relative;display:flex;gap:12px;flex-wrap:wrap;}

  /* ---------- location ---------- */
  .loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  .loc-card{
    background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:34px;
  }
  .loc-row{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--card-border);}
  .loc-row:last-child{border-bottom:none;}
  .loc-row .ico{width:38px;height:38px;border-radius:8px;background:rgba(214,40,57,0.12);border:1px solid rgba(214,40,57,0.3);display:flex;align-items:center;justify-content:center;color:var(--red);flex:none;}
  .loc-row h4{font-size:14.5px;font-weight:700;margin-bottom:3px;}
  .loc-row p{font-size:13.5px;color:var(--text-dim);}
  .map-box{
    aspect-ratio:1/0.85;border-r
